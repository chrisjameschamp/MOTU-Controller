[package]
name = "motu-controller"
version = "0.1.1"
description = "Nano-D++ controller for MOTU 828es"
authors = ["Chris Champeau"]
license = "MIT"
edition = "2021"

[lib]
name = "motu_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.6"
tauri = { version = "2.0", features = ["image-png", "macos-private-api", "tray-icon"] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "time"] }
